name: BDJobs CV Scraper

on:
  workflow_dispatch:
    inputs:
      job_label:
        description: "Job label (e.g., CostControl-SrExecutive)"
        required: true
        type: string
      job_url:
        description: "BDJobs job posting URL"
        required: true
        type: string
      max_candidates:
        description: "Maximum candidates to download (0 = all)"
        required: false
        default: "0"
        type: string
      department:
        description: "Department name"
        required: false
        default: "Uncategorized"
        type: string
      force_relogin:
        description: "Clear session and force a fresh BDJobs login"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: self-hosted
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Python
        run: |
          python --version
          Write-Host "[OK] Python found"

      - name: Install / update dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Login to BDJobs
        env:
          PYTHONUNBUFFERED: "1"
          BDJOBS_USER: ${{ secrets.BDJOBS_USER }}
          BDJOBS_PASS: ${{ secrets.BDJOBS_PASS }}
          PG_HOST:     ${{ secrets.PG_HOST }}
          PG_PORT:     ${{ secrets.PG_PORT }}
          PG_DBNAME:   ${{ secrets.PG_DBNAME }}
          PG_USER:     ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          Write-Host "=== Step 1: Login ==="
          $forceFlag = ""
          if ("${{ github.event.inputs.force_relogin }}" -eq "true") {
            $forceFlag = "--force"
            Write-Host "[INFO] Force re-login requested"
          }
          $args = @(
            "bdjobs_auto_login.py",
            "--username", "${{ secrets.BDJOBS_USER }}",
            "--password", "${{ secrets.BDJOBS_PASS }}",
            "--headless"
          )
          if ($forceFlag) { $args += $forceFlag }
          python @args
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] Login failed"
            exit 1
          }
          Write-Host "=== Session dir contents ==="
          if (Test-Path "bdjobs_session") { Get-ChildItem -Path "bdjobs_session" } else { Write-Host "No bdjobs_session/ found" }

      - name: Download CVs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          Write-Host "=== Step 2: Download CVs ==="
          python bdjobs_downloader.py `
            --label "${{ github.event.inputs.job_label }}" `
            --url "${{ github.event.inputs.job_url }}" `
            --max-candidates ${{ github.event.inputs.max_candidates || 0 }} `
            --headless
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[ERROR] Download failed"
            exit 1
          }

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            _login_failure.png
            _login_before.png
            _login_page_dump.html
            _login_failure_page.html
            downloaded_resumes/**/_failure_screenshot.png
            downloaded_resumes/**/_pagination_failure.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit downloaded CVs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add downloaded_resumes/
          $diff = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No new CVs to commit"
          } else {
            git commit -m "Add CVs for ${{ github.event.inputs.job_label }} via GitHub Actions"
            git push origin ${{ github.ref_name }}
          }

      - name: Upload CVs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvs-${{ github.run_number }}
          path: downloaded_resumes/
          retention-days: 7
          if-no-files-found: warn

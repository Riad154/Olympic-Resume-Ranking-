name: BDJobs CV Scraper

on:
  workflow_dispatch:
    inputs:
      job_label:
        description: "Job label (e.g., CostControl-SrExecutive)"
        required: true
        type: string
      job_url:
        description: "BDJobs job posting URL"
        required: true
        type: string
      max_candidates:
        description: "Maximum candidates to download (0 = all)"
        required: false
        default: "0"
        type: string
      department:
        description: "Department name"
        required: false
        default: "Uncategorized"
        type: string
      force_relogin:
        description: "Clear session and force a fresh BDJobs login"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract jobno and download CVs via API
        env:
          PYTHONUNBUFFERED: "1"
          BDJOBS_JWT: ${{ secrets.BDJOBS_JWT }}
          BDJOBS_COMPANY_ID: ${{ secrets.BDJOBS_COMPANY_ID }}
          BDJOBS_ENCRYPT_ID: ${{ secrets.BDJOBS_ENCRYPT_ID }}
        run: |
          set -e
          echo "=== Extract jobno from URL ==="
          JOB_URL="${{ github.event.inputs.job_url }}"
          JOBNO=$(python -c "from urllib.parse import parse_qs, urlparse; u='${JOB_URL}'; q=parse_qs(urlparse(u).query); print(q.get('jobno',[0])[0])")
          echo "[INFO] JobNo = $JOBNO"
          if [ "$JOBNO" = "0" ] || [ -z "$JOBNO" ]; then
            echo "[ERROR] Could not extract jobno from URL: $JOB_URL"
            exit 1
          fi

          MAX=${{ github.event.inputs.max_candidates }}
          if [ -z "$MAX" ] || [ "$MAX" = "0" ]; then
            MAX=0
          fi

          echo "=== Download CVs via API (using stored JWT) ==="
          python bdjobs_api_downloader.py \
            --jwt "${{ secrets.BDJOBS_JWT }}" \
            --company-id "${{ secrets.BDJOBS_COMPANY_ID }}" \
            --encrypt-id "${{ secrets.BDJOBS_ENCRYPT_ID }}" \
            --jobno "$JOBNO" \
            --label "${{ github.event.inputs.job_label }}" \
            --job-title "${{ github.event.inputs.job_label }}" \
            --max-candidates "$MAX"

      - name: Commit downloaded CVs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -f downloaded_resumes/
          if git diff --cached --quiet; then
            echo "No new CVs to commit"
          else
            git commit -m "Add CVs for ${{ github.event.inputs.job_label }} via GitHub Actions"
            git push origin ${{ github.ref_name }}
          fi

      - name: Upload CVs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvs-${{ github.run_number }}
          path: downloaded_resumes/
          retention-days: 7
          if-no-files-found: warn

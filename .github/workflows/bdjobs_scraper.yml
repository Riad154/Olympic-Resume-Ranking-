name: BDJobs CV Scraper

on:
  workflow_dispatch:
    inputs:
      job_label:
        description: "Job label (e.g., CostControl-SrExecutive)"
        required: true
        type: string
      job_url:
        description: "BDJobs job posting URL"
        required: true
        type: string
      max_candidates:
        description: "Maximum candidates to download (0 = all)"
        required: false
        default: "0"
        type: string
      department:
        description: "Department name"
        required: false
        default: "Uncategorized"
        type: string
      force_relogin:
        description: "Clear session and force a fresh BDJobs login"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit downloaded CVs back to repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Login and download CVs
        env:
          BDJOBS_USER: ${{ secrets.BDJOBS_USER }}
          BDJOBS_PASS: ${{ secrets.BDJOBS_PASS }}
          PG_HOST:     ${{ secrets.PG_HOST }}
          PG_PORT:     ${{ secrets.PG_PORT }}
          PG_DBNAME:   ${{ secrets.PG_DBNAME }}
          PG_USER:     ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          echo "=== Step 1: Login ==="
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_relogin }}" = "true" ]; then
            FORCE_FLAG="--force"
            echo "[INFO] Force re-login requested — clearing old session"
          fi
          python bdjobs_auto_login.py \
            --username "${{ secrets.BDJOBS_USER }}" \
            --password "${{ secrets.BDJOBS_PASS }}" \
            --headless $FORCE_FLAG || {
            echo "[ERROR] Login step failed. See screenshot artifact for details."
            exit 1
          }

          echo "=== Debug: session dir contents ==="
          ls -la bdjobs_session/ 2>/dev/null || echo "No bdjobs_session/ directory found"

          echo "=== Step 2: Download ==="
          python bdjobs_downloader.py \
            --label "${{ github.event.inputs.job_label }}" \
            --url "${{ github.event.inputs.job_url }}" \
            --max-candidates ${{ github.event.inputs.max_candidates || 0 }} \
            --headless

      - name: Upload login failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug-${{ github.run_number }}
          path: |
            _login_failure.png
            _login_before.png
            _login_failure_page.html
            _login_before_page.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: |
            downloaded_resumes/**/_failure_screenshot.png
            downloaded_resumes/**/_pagination_failure.png
            downloaded_resumes/**/_pagination_dom.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit downloaded CVs to repository
        continue-on-error: true   # don't fail the whole workflow if git push is blocked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add downloaded_resumes/
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new CVs to commit"
          else
            git commit -m "Add CVs for ${{ github.event.inputs.job_label }} via GitHub Actions"
            git push origin ${{ github.ref_name }}
          fi

      - name: Upload workflow artifact (CVs)
        if: always()   # upload even if commit step failed
        uses: actions/upload-artifact@v4
        with:
          name: cvs-${{ github.run_number }}
          path: downloaded_resumes/
          retention-days: 7
          if-no-files-found: warn

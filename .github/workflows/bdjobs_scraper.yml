name: BDJobs CV Scraper

on:
  workflow_dispatch:
    inputs:
      job_label:
        description: "Job label (e.g., CostControl-SrExecutive)"
        required: true
        type: string
      job_url:
        description: "BDJobs job posting URL"
        required: true
        type: string
      max_candidates:
        description: "Maximum candidates to download (0 = all)"
        required: false
        default: "0"
        type: string
      department:
        description: "Department name"
        required: false
        default: "Uncategorized"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run BDJobs auto-login
        env:
          BDJOBS_USER: ${{ secrets.BDJOBS_USER }}
          BDJOBS_PASS: ${{ secrets.BDJOBS_PASS }}
        run: |
          python bdjobs_auto_login.py --headless --wait-for-flag _login_done.flag

      - name: Run BDJobs downloader
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DBNAME: ${{ secrets.PG_DBNAME }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: |
          python bdjobs_downloader.py \
            --job "${{ github.event.inputs.job_label }}" \
            --url "${{ github.event.inputs.job_url }}" \
            --max-candidates ${{ github.event.inputs.max_candidates || 0 }} \
            --department "${{ github.event.inputs.department || 'Uncategorized' }}" \
            --wait-for-flag _download_done.flag

      - name: Commit downloaded CVs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_resumes/
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No new CVs to commit"
          else
            git commit -m "Add CVs for ${{ github.event.inputs.job_label }} via GitHub Actions"
            git push
          fi

      - name: Upload workflow artifact (CVs)
        uses: actions/upload-artifact@v4
        with:
          name: cvs-${{ github.event.inputs.job_label }}-${{ github.run_number }}
          path: downloaded_resumes/${{ github.event.inputs.job_label }}/
          retention-days: 7

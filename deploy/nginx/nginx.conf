# nginx.conf — Reverse proxy with basic auth for Ollama + n8n
# Place this in deploy/nginx/ and mount into an nginx container.
#
# For HTTPS/TLS, use Let's Encrypt with certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# Streamlit Cloud → nginx (80/443) → Ollama (11434) / n8n (5678)

upstream ollama_backend {
    server ollama:11434;
}

upstream n8n_backend {
    server n8n:5678;
}

server {
    listen 80;
    server_name _;  # Replace with your-domain.com for production

    # ── Ollama proxy ──────────────────────────────────────────────────────
    location /ollama/ {
        auth_basic           "Ollama Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://ollama_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_buffering    off;
        proxy_cache        off;

        # Timeouts for LLM generation (up to 4 minutes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── n8n proxy ─────────────────────────────────────────────────────────
    location /n8n/ {
        auth_basic           "n8n Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://n8n_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support for n8n editor
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
